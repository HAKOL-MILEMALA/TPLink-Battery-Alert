name: Build M7200 Car Alert APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'README_HE.md'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

      - name: Restore stable signing key
        env:
          M7200_SIGNING_BUNDLE_B64: ${{ secrets.M7200_SIGNING_BUNDLE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${M7200_SIGNING_BUNDLE_B64:-}" ]; then
            echo "::error title=Missing signing secret::Create repository secret M7200_SIGNING_BUNDLE_B64 before building. See README_HE.md."
            exit 1
          fi
          printf '%s' "$M7200_SIGNING_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/m7200-signing.zip"
          mkdir -p signing
          unzip -oq "$RUNNER_TEMP/m7200-signing.zip" -d .
          chmod 600 signing/m7200-release.jks signing/keystore.properties
          test -s signing/m7200-release.jks
          test -s signing/keystore.properties

      - name: Build signed debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\\1/p" app/build.gradle | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle"
            exit 1
          fi
          APK_NAME="M7200-Car-Alert-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: M7200-Car-Alert-${{ steps.apk.outputs.version_name }}-APK
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ steps.apk.outputs.version_name }}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "${{ steps.apk.outputs.apk_name }}" \
            --title "M7200 Car Alert ${{ steps.apk.outputs.version_name }}" \
            --notes "Android APK generated by GitHub Actions. Stable signing is used for in-place app updates."
          echo "APK Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
