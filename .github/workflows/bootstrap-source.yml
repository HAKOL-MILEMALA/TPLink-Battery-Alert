name: Bootstrap M7200 Car Alert and build APK

on:
  push:
    branches: [main]
    paths:
      - 'source-bootstrap.tar.xz.b64'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap-build:
    name: Restore source and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source-bootstrap.tar.xz.b64 | tar -xJf - -C .
          rm -f source-bootstrap.tar.xz.b64
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add M7200 Car Alert Android project"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk M7200-Car-Alert-1.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: M7200-Car-Alert-1.0.1-APK
          path: M7200-Car-Alert-1.0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" M7200-Car-Alert-1.0.1.apk \
            --title "M7200 Car Alert 1.0.1 – build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK generated by GitHub Actions for the TS10S Android 12 head unit."
          echo "APK Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
