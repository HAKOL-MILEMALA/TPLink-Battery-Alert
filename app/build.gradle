import java.util.Properties

plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("signing/keystore.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'il.hakolmilemala.m7200caralert'
    compileSdk 35

    defaultConfig {
        applicationId 'il.hakolmilemala.m7200caralert'
        minSdk 26
        targetSdk 32
        versionCode 3
        versionName '1.0.2'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (signingPropertiesFile.exists()) {
        signingConfigs {
            stable {
                storeFile rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
        buildTypes {
            release {
                // All distributed APKs use one protected key for in-place updates.
                signingConfig signingConfigs.stable
                minifyEnabled false
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
